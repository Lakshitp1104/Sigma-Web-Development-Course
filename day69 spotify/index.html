<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
    <title>Spotify - Web Player: Music for everyone</title>
</head>

<body>
    <div class="container flex bg-black">
        <div class="left">
            <div class="close">
                <button id="closeSidebar" class="iconButton" type="button" aria-label="Close library">
                    <img width="30" class="invert" src="img/close.svg" alt="">
                </button>
            </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo"><img width="110" class="invert" src="img/logo.svg" alt=""></div>
                <ul>
                    <li><img class="invert" src="img/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="img/search.svg" alt="search">Search</li>
                </ul>
            </div>

            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="img/playlist.svg" alt="">
                    <h2>
                        Your Library
                    </h2>
                </div>

                <div class="songList">

                    <ul>

                    </ul>
                </div>

                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>


        </div>
        <div class="right bg-grey rounded">
            <div class="header">
                <div class="nav">
                    <div class="hamburgerContainer">

                        <button id="openSidebar" class="iconButton hamburger" type="button" aria-label="Open library"
                            aria-expanded="false">
                            <img width="40" class="invert" src="img/hamburger.svg" alt="">
                        </button>
                        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
                <div class="buttons">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Log in</button>
                </div>
            </div>
            <div class="spotifyPlaylists">
                <h1>Spotify Playlists</h1>
                <div class="cardContainer">  </div>
                <div class="playbar">
                    <input class="seekbar" id="seekbar" type="range" min="0" max="100" value="0" step="0.1"
                        aria-label="Playback position" disabled>
                    <div class="abovebar">


                        <div class="songinfo" aria-live="polite">Choose a playlist to begin</div>
                        <div class="songbuttons">
                            <button id="previous" type="button" aria-label="Previous track" disabled>
                                <img width="35" src="img/prevsong.svg" alt="">
                            </button>
                            <button id="play" type="button" aria-label="Play" disabled>
                                <img width="35" src="img/play.svg" alt="">
                            </button>
                            <button id="next" type="button" aria-label="Next track" disabled>
                                <img width="35" src="img/nextsong.svg" alt="">
                            </button>
                        </div>
                        <div class="timevol">

                       
                        <div class="songtime" aria-label="Playback time">00:00 / 00:00</div>
                        <div class="volume">
                            <button id="volumeToggle" type="button" aria-label="Mute">
                                <img width="25" src="img/volume.svg" alt="">
                            </button>
                            <div class="range">
                                <label class="visually-hidden" for="volume">Volume</label>
                                <input type="range" name="volume" id="volume" min="0" max="100" value="100">
                            </div>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
