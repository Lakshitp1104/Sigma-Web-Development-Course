<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">♫</div>
                    <span>Spotify</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="#home" class="nav-item active" data-section="home">
                    <span class="icon">🏠</span>
                    <span>Home</span>
                </a>
                <a href="#search" class="nav-item" data-section="search">
                    <span class="icon">🔍</span>
                    <span>Search</span>
                </a>
                <a href="#library" class="nav-item" data-section="library">
                    <span class="icon">📚</span>
                    <span>Your Library</span>
                </a>
            </nav>

            <div class="sidebar-divider"></div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item" id="create-playlist-btn">
                    <span class="icon">➕</span>
                    <span>Create Playlist</span>
                </a>
                <a href="#liked" class="nav-item" data-section="liked">
                    <span class="icon">❤️</span>
                    <span>Liked Songs</span>
                </a>
            </nav>

            <div class="sidebar-playlists" id="playlists-container">
                <!-- Playlists will be added dynamically -->
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Navigation Bar -->
            <nav class="top-nav">
                <div class="nav-controls">
                    <button class="nav-btn back-btn" id="back-btn" title="Back">◀</button>
                    <button class="nav-btn forward-btn" id="forward-btn" title="Forward">▶</button>
                </div>

                <div class="search-bar-container">
                    <input type="text" class="search-bar" id="top-search" placeholder="Search songs, artists...">
                </div>

                <div class="nav-right">
                    <button class="nav-btn theme-toggle-btn" id="theme-toggle" title="Toggle Theme">🌙</button>
                    <button class="nav-btn premium-btn">🎵 Premium</button>
                    <button class="nav-btn install-btn">⬇️ Install App</button>
                    <button class="nav-btn login-btn">👤 Login</button>
                </div>
            </nav>

            <!-- Content Area -->
            <div class="content-wrapper">
                <!-- Home Section -->
                <section class="section active" id="home-section">
                    <div class="section-header">
                        <h1>Welcome to Spotify Clone</h1>
                        <p>Discover, play, and enjoy your favorite music</p>
                    </div>

                    <div class="section-title">Recently Played</div>
                    <div class="albums-grid" id="recently-played">
                        <!-- Recently played albums will be added here -->
                    </div>

                    <div class="section-title">All Albums</div>
                    <div class="albums-grid" id="albums-grid">
                        <!-- Albums will be loaded dynamically -->
                    </div>
                </section>

                <!-- Search Section -->
                <section class="section" id="search-section">
                    <div class="search-content">
                        <div class="search-form">
                            <input type="text" class="search-input" id="search-input" placeholder="Search albums or songs...">
                        </div>

                        <div class="search-results" id="search-results">
                            <div class="no-results">Start typing to search...</div>
                        </div>
                    </div>
                </section>

                <!-- Library Section -->
                <section class="section" id="library-section">
                    <div class="library-content">
                        <h2>Your Library</h2>
                        <div class="library-items" id="library-items">
                            <!-- Library items will be added here -->
                        </div>
                    </div>
                </section>

                <!-- Liked Songs Section -->
                <section class="section" id="liked-section">
                    <div class="liked-content">
                        <h2>❤️ Liked Songs</h2>
                        <div class="songs-list" id="liked-songs-list">
                            <!-- Liked songs will be added here -->
                        </div>
                    </div>
                </section>

                <!-- Album Detail Section -->
                <section class="section" id="album-detail-section">
                    <div class="album-detail-header">
                        <button class="back-to-albums" id="back-to-albums">← Back</button>
                        <h2 id="album-detail-title"></h2>
                    </div>
                    <div class="album-songs-list" id="album-songs-list">
                        <!-- Album songs will be listed here -->
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Music Player -->
    <div class="player-container">
        <div class="player-progress">
            <span class="current-time" id="current-time">0:00</span>
            <input type="range" class="progress-bar" id="progress-bar" min="0" max="100" value="0">
            <span class="duration" id="duration-time">0:00</span>
        </div>

        <div class="player-main">
            <div class="player-song-info">
                <div class="player-cover">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23181818' width='100' height='100'/%3E%3Ctext x='50' y='50' font-size='40' fill='%231DB954' text-anchor='middle' dominant-baseline='middle'%3E♫%3C/text%3E%3C/svg%3E" alt="Cover" id="player-cover">
                </div>
                <div class="player-info">
                    <div class="player-song-name">Select a song</div>
                    <div class="player-artist-name">Choose from albums</div>
                </div>
            </div>

            <div class="player-controls">
                <button class="control-btn shuffle-btn" id="shuffle-btn" title="Shuffle">🔀</button>
                <button class="control-btn prev-btn" id="prev-btn" title="Previous">⏮</button>
                <button class="control-btn play-btn" id="play-btn" title="Play">▶</button>
                <button class="control-btn next-btn" id="next-btn" title="Next">⏭</button>
                <button class="control-btn repeat-btn" id="repeat-btn" title="Repeat">🔁</button>
            </div>

            <div class="player-volume">
                <button class="volume-btn" id="volume-btn" title="Mute">🔊</button>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="70">
                <span class="volume-percent" id="volume-percent">70%</span>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <!-- Modal for Create Playlist -->
    <div class="modal" id="playlist-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create a Playlist</h2>
                <button class="modal-close" id="modal-close">✕</button>
            </div>
            <div class="modal-body">
                <input type="text" class="playlist-input" id="playlist-name" placeholder="Enter playlist name...">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn-primary" id="modal-create">Create</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
